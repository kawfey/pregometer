name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '*.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache the browser runtime
        uses: actions/cache@v6
        with:
          path: web/.pyodide-cache
          key: runtime-${{ hashFiles('web/build.py') }}

      - name: Build the site
        run: python3 web/build.py --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
